# Runs the test suite on GitHub for every push and pull request.
# Results appear as a check mark (pass) or cross (fail) next to each commit, and in the "Actions" tab.
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbital_eye_ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orbital_eye_ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyTorch (CPU) for the training smoke test
        run: pip install -r requirements-ml.txt matplotlib

      - name: Run tests
        run: pytest -v
