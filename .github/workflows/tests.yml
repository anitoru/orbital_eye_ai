# Runs the test suite on GitHub for every push and pull request.
# Results appear as a check mark (pass) or cross (fail) next to each commit, and in the "Actions" tab.
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbital_eye_ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orbital_eye_ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyTorch (CPU) for the training smoke test
        run: pip install -r requirements-ml.txt matplotlib

      - name: Run tests
        run: pytest -v

  docker:
    # Builds the public-demo container exactly as Hugging Face Spaces will, then checks it serves pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t orbital-eye-demo orbital_eye_ai
      - name: Start container and check pages
        run: |
          docker run -d --name demo -p 7860:7860 orbital-eye-demo
          for i in $(seq 1 60); do curl -sf http://localhost:7860/ > /dev/null && break; sleep 2; done
          docker logs demo
          for page in / /astronauts /astronauts/AST-001 /alerts /nasa; do
            curl -sf "http://localhost:7860$page" | grep -q "ORBITAL EYE" || { echo "FAILED $page"; exit 1; }
            echo "OK $page"
          done
          curl -sf http://localhost:7860/ | grep -q "Public demo"
